name: Electron Linux Ubuntu 22.04 Test Release

# Upstream-only: publishes prerelease assets to presenton/presenton-export using
# RELEASE_REPO_TOKEN, which forks do not have. Manual trigger only, and skipped outside
# the upstream repository. The branch push trigger was removed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-linux-ubuntu22
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Electron on Ubuntu 22.04
    if: github.repository == 'presenton/presenton' && github.ref_name == 'electron-linux-ubuntu22'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            servers/nextjs/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: servers/fastapi/uv.lock

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            fakeroot \
            libarchive-tools \
            rpm

      - name: Build Electron Linux packages
        working-directory: electron
        env:
          # electron-builder v26 otherwise attempts an implicit GitHub publish in CI.
          CI: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:all

      - name: Verify release assets
        run: |
          test -n "$(find electron/dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find electron/dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          find electron/dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.AppImage' \) -print

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: presenton-electron-linux-ubuntu-22
          path: |
            electron/dist/*.deb
            electron/dist/*.AppImage
          if-no-files-found: error

      - name: Publish temporary presenton-export prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPOSITORY: presenton/presenton-export
          RELEASE_TAG: presenton-electron-linux-ubuntu-22
          RELEASE_TITLE: presenton-electron-linux-ubuntu-22
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "RELEASE_REPO_TOKEN is required to publish to ${RELEASE_REPOSITORY}." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${RELEASE_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "Temporary Ubuntu 22.04 Electron Linux compatibility build from presenton/presenton@${GITHUB_SHA}. This test release will be removed later." \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${RELEASE_REPOSITORY}" \
              --target main \
              --title "${RELEASE_TITLE}" \
              --notes "Temporary Ubuntu 22.04 Electron Linux compatibility build from presenton/presenton@${GITHUB_SHA}. This test release will be removed later." \
              --prerelease
          fi

          gh release upload "${RELEASE_TAG}" \
            electron/dist/*.deb \
            electron/dist/*.AppImage \
            --repo "${RELEASE_REPOSITORY}" \
            --clobber
